name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Bir vaqtda bitta deploy; navbatdagisi kutadi, ishlayotgani to'xtatilmaydi
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      # `next build` TypeScript tekshiruvini o'zi bajaradi
      - name: Build static demo
        env:
          # Repo nomidan olinadi — repo qayta nomlansa ham to'g'ri ishlaydi
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          # Backend yo'q: forma "yuborildi" deb ko'rsatadi va buni ochiq aytadi
          NEXT_PUBLIC_DEMO_MODE: '1'
        run: npm run build:static

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
