<title>Global Avenue Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@500;600;700;800&display=swap">
<style>
  :root{
    --bg:#F6F4EE;
    --surface:#FFFFFF;
    --surface-2:#FBF9F4;
    --border:#E4DFD3;
    --border-soft:#EDE9DE;
    --ink:#1E2A3C;
    --ink-soft:#3C4657;
    --muted:#79705F;
    --muted-2:#9B927E;
    --accent:#A9813F;
    --accent-ink:#6E5527;
    --accent-wash:#F1E6D2;
    --success:#2E7D5B;
    --success-wash:#E1EFE7;
    --warning:#B5711F;
    --warning-wash:#F5E7D2;
    --danger:#AE3B26;
    --danger-wash:#F5E0DA;
    --info:#2F5FA3;
    --info-wash:#E2EAF5;
    --shadow: 0 1px 2px rgba(30,42,60,.04), 0 8px 24px -12px rgba(30,42,60,.14);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12161D;
      --surface:#1A2029;
      --surface-2:#1F2630;
      --border:#2B3341;
      --border-soft:#242C38;
      --ink:#ECE8DE;
      --ink-soft:#CBC5B6;
      --muted:#9A9384;
      --muted-2:#726C5F;
      --accent:#CDA25C;
      --accent-ink:#EAD3A3;
      --accent-wash:#332A19;
      --success:#5FB98C;
      --success-wash:#173226;
      --warning:#D99A4E;
      --warning-wash:#3A2A14;
      --danger:#E07C63;
      --danger-wash:#3A2018;
      --info:#7FA6DD;
      --info-wash:#1B2A3E;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#12161D;
    --surface:#1A2029;
    --surface-2:#1F2630;
    --border:#2B3341;
    --border-soft:#242C38;
    --ink:#ECE8DE;
    --ink-soft:#CBC5B6;
    --muted:#9A9384;
    --muted-2:#726C5F;
    --accent:#CDA25C;
    --accent-ink:#EAD3A3;
    --accent-wash:#332A19;
    --success:#5FB98C;
    --success-wash:#173226;
    --warning:#D99A4E;
    --warning-wash:#3A2A14;
    --danger:#E07C63;
    --danger-wash:#3A2018;
    --info:#7FA6DD;
    --info-wash:#1B2A3E;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink-soft);
    font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{color:var(--ink);margin:0;text-wrap:balance;}
  .brand-face{font-family:"Fraunces",Georgia,serif;}
  ::selection{background:var(--accent-wash);}
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit;font-size:14px;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}

  .app{display:flex;min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:238px;flex:0 0 238px;
    background:var(--surface);
    border-right:1px solid var(--border);
    display:flex;flex-direction:column;
    padding:20px 14px;
    position:sticky;top:0;height:100vh;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;border-bottom:1px solid var(--border-soft);margin-bottom:14px;}
  .brand-mark{
    width:34px;height:34px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    position:relative;
  }
  .brand-mark img{width:100%;height:100%;object-fit:contain;display:block;position:absolute;inset:0;transition:opacity .15s;}
  .brand-mark img.mark-gold{opacity:0;}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .brand-mark img.mark-dark{opacity:0;}
    :root:not([data-theme="light"]) .brand-mark img.mark-gold{opacity:1;}
  }
  :root[data-theme="dark"] .brand-mark img.mark-dark{opacity:0;}
  :root[data-theme="dark"] .brand-mark img.mark-gold{opacity:1;}
  .brand-text{line-height:1.15;}
  .brand-text .name{font-family:"Fraunces",serif;font-weight:600;font-size:15px;color:var(--ink);letter-spacing:.2px;}
  .brand-text .sub{font-size:10.5px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.09em;}

  .nav{display:flex;flex-direction:column;gap:2px;flex:1;}
  .nav-item{
    display:flex;align-items:center;gap:10px;
    padding:9px 10px;border-radius:9px;
    color:var(--muted);font-size:13.5px;font-weight:600;
    cursor:pointer;border:none;background:none;text-align:left;width:100%;
    position:relative;
  }
  .nav-item svg{flex:0 0 auto;opacity:.85;}
  .nav-item:hover{background:var(--surface-2);color:var(--ink);}
  .nav-item.active{background:var(--accent-wash);color:var(--accent-ink);}
  .nav-item.active svg{opacity:1;}
  .nav-badge{
    margin-left:auto;min-width:18px;height:18px;padding:0 5px;border-radius:999px;
    background:var(--info);color:#fff;font-size:10.5px;font-weight:800;
    display:flex;align-items:center;justify-content:center;
  }
  .nav-sep{height:1px;background:var(--border-soft);margin:10px 4px;}

  .role-box{
    border:1px solid var(--border);border-radius:12px;padding:11px;background:var(--surface-2);
  }
  .role-box .rl-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted-2);font-weight:700;margin-bottom:6px;}
  .role-box select{
    width:100%;padding:7px 8px;border-radius:8px;border:1px solid var(--border);
    background:var(--surface);color:var(--ink);font-weight:700;font-size:12.5px;
  }
  .role-box .rl-hint{font-size:11px;color:var(--muted);margin-top:7px;line-height:1.4;}

  /* ---------- Main ---------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:20px 30px;border-bottom:1px solid var(--border);
    background:var(--surface);position:sticky;top:0;z-index:5;
  }
  .topbar h1{font-family:"Fraunces",serif;font-size:22px;font-weight:600;}
  .topbar .desc{font-size:12.5px;color:var(--muted);margin-top:3px;}
  .topbar-actions{display:flex;gap:10px;align-items:center;}

  .content{padding:26px 30px 60px;max-width:1240px;}
  section.view{display:none;}
  section.view.active{display:block;}

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;gap:7px;
    padding:8px 14px;border-radius:9px;border:1px solid var(--border);
    background:var(--surface);color:var(--ink-soft);font-weight:700;font-size:13px;
    cursor:pointer;white-space:nowrap;
  }
  .btn:hover{border-color:var(--muted-2);color:var(--ink);}
  .btn:focus-visible, .nav-item:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible{
    outline:2px solid var(--accent);outline-offset:1px;
  }
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-ink);border-color:var(--accent-ink);color:#fff;}
  .btn-ghost{border-color:transparent;background:transparent;padding:6px 8px;}
  .btn-ghost:hover{background:var(--surface-2);}
  .btn-danger-ghost{border-color:transparent;background:transparent;color:var(--danger);padding:6px 8px;}
  .btn-danger-ghost:hover{background:var(--danger-wash);}
  .btn[disabled]{opacity:.4;cursor:not-allowed;}
  .btn-sm{padding:5px 10px;font-size:12px;border-radius:7px;}
  .icon-btn{padding:6px;border-radius:7px;}

  /* ---------- Cards / KPI ---------- */
  .grid-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
  .kpi{
    background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;
    box-shadow:var(--shadow);
  }
  .kpi .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-2);font-weight:700;}
  .kpi .val{font-family:"Manrope";font-size:27px;font-weight:800;color:var(--ink);margin-top:7px;font-variant-numeric:tabular-nums;}
  .kpi .foot{font-size:12px;color:var(--muted);margin-top:5px;}
  .kpi .foot.up{color:var(--success);}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);}
  .panel-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border-soft);}
  .panel-head h3{font-size:14.5px;font-weight:800;color:var(--ink);}
  .panel-body{padding:16px 18px;}
  .two-col{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start;margin-bottom:16px;}

  /* status distribution bar */
  .stack-bar{display:flex;width:100%;height:12px;border-radius:999px;overflow:hidden;background:var(--border-soft);}
  .stack-bar span{height:100%;}
  .legend{display:flex;gap:16px;margin-top:12px;flex-wrap:wrap;}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);}
  .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}

  .mini-list{display:flex;flex-direction:column;}
  .mini-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border-soft);}
  .mini-row:last-child{border-bottom:none;}
  .mini-ava{width:32px;height:32px;border-radius:9px;background:var(--info-wash);color:var(--info);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;flex:0 0 auto;}
  .mini-main{flex:1;min-width:0;}
  .mini-main .t1{font-size:13px;font-weight:700;color:var(--ink);}
  .mini-main .t2{font-size:11.5px;color:var(--muted);margin-top:1px;}
  .mini-time{font-size:11px;color:var(--muted-2);white-space:nowrap;}

  .proj-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border-soft);}
  .proj-row:last-child{border-bottom:none;}
  .proj-badge{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:"Fraunces",serif;font-weight:600;font-size:14px;flex:0 0 auto;}
  .proj-main{flex:1;min-width:0;}
  .proj-main .t1{font-size:13.5px;font-weight:700;color:var(--ink);}
  .proj-main .t2{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .proj-bar{width:110px;flex:0 0 auto;}
  .proj-bar .track{height:6px;border-radius:999px;background:var(--border-soft);overflow:hidden;}
  .proj-bar .fill{height:100%;background:var(--accent);}
  .proj-bar .pct{font-size:10.5px;color:var(--muted);margin-top:4px;text-align:right;font-variant-numeric:tabular-nums;}

  /* ---------- Filters ---------- */
  .filter-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
  .chip{
    padding:6px 12px;border-radius:999px;border:1px solid var(--border);
    background:var(--surface);color:var(--muted);font-size:12.5px;font-weight:700;cursor:pointer;
  }
  .chip:hover{color:var(--ink);}
  .chip.active{background:var(--ink);border-color:var(--ink);color:var(--bg);}
  .search-input{
    margin-left:auto;padding:7px 12px;border-radius:9px;border:1px solid var(--border);
    background:var(--surface);color:var(--ink);font-size:12.5px;min-width:200px;
  }

  /* ---------- Table ---------- */
  .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);}
  table{width:100%;border-collapse:collapse;min-width:640px;}
  thead th{
    text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted-2);
    font-weight:800;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap;
  }
  tbody td{padding:12px 16px;border-bottom:1px solid var(--border-soft);font-size:13px;color:var(--ink-soft);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--surface-2);}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
  td.actions{text-align:right;white-space:nowrap;}
  .cell-main{font-weight:700;color:var(--ink);}
  .cell-sub{font-size:11.5px;color:var(--muted);margin-top:1px;}
  .empty-state{padding:46px 20px;text-align:center;color:var(--muted);}
  .empty-state .ic{margin-bottom:10px;opacity:.5;}
  .empty-state .t{font-weight:700;color:var(--ink-soft);font-size:14px;margin-bottom:4px;}
  .empty-state .s{font-size:12.5px;}

  /* ---------- Pills ---------- */
  .pill{
    display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;
    font-size:11px;font-weight:800;white-space:nowrap;
  }
  .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
  .pill-success{background:var(--success-wash);color:var(--success);}
  .pill-warning{background:var(--warning-wash);color:var(--warning);}
  .pill-danger{background:var(--danger-wash);color:var(--danger);}
  .pill-info{background:var(--info-wash);color:var(--info);}
  .pill-muted{background:var(--border-soft);color:var(--muted);}

  select.status-select{
    border:1px solid var(--border);border-radius:8px;padding:5px 8px;font-size:12px;font-weight:700;
    background:var(--surface);color:var(--ink);
  }

  .role-tag{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--accent-wash);color:var(--accent-ink);}

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(20,22,18,.42);backdrop-filter:blur(1.5px);
    display:none;align-items:flex-start;justify-content:center;z-index:50;padding:6vh 20px;overflow-y:auto;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--surface);border-radius:16px;border:1px solid var(--border);
    width:100%;max-width:480px;box-shadow:0 24px 60px -20px rgba(0,0,0,.35);
  }
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border-soft);}
  .modal-head h3{font-family:"Fraunces",serif;font-size:17px;font-weight:600;}
  .modal-body{padding:18px 20px;display:flex;flex-direction:column;gap:13px;max-height:60vh;overflow-y:auto;}
  .modal-foot{display:flex;justify-content:flex-end;gap:9px;padding:16px 20px;border-top:1px solid var(--border-soft);}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
  .field input,.field select,.field textarea{
    padding:9px 11px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);color:var(--ink);
  }
  .field textarea{resize:vertical;min-height:70px;font-family:inherit;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

  /* ---------- Toast ---------- */
  .login-gate{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:34px 28px 28px;display:flex;flex-direction:column;align-items:center;text-align:center;}
  .login-card .login-mark{width:52px;height:52px;margin-bottom:12px;}
  .login-card .login-mark img{width:100%;height:100%;object-fit:contain;display:block;}
  .login-card h1{font-family:"Fraunces",serif;font-size:19px;font-weight:600;color:var(--ink);margin-bottom:3px;}
  .login-card .sub{font-size:12px;color:var(--muted);margin-bottom:22px;}
  .login-card .field{width:100%;text-align:left;margin-bottom:8px;}
  .login-card .btn-block{width:100%;justify-content:center;margin-top:10px;}
  .login-error{font-size:12px;color:var(--danger);align-self:flex-start;margin:2px 0 0;}
  .toast-wrap{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:80;}
  .toast{
    background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:10px;font-size:13px;font-weight:700;
    box-shadow:0 12px 30px -10px rgba(0,0,0,.4);display:flex;align-items:center;gap:8px;
    animation:toastIn .18s ease-out;
  }
  .toast.err{background:var(--danger);}
  @keyframes toastIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  .helper-note{
    display:flex;gap:9px;align-items:flex-start;background:var(--info-wash);color:var(--info);
    border-radius:10px;padding:10px 12px;font-size:12px;margin-bottom:16px;line-height:1.5;
  }
  .helper-note b{color:inherit;}

  .locked-note{font-size:11.5px;color:var(--muted-2);font-style:italic;}

  /* ---------- Leads: toolbar / view toggle ---------- */
  .leads-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .view-toggle{display:flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;flex:0 0 auto;}
  .view-toggle button{padding:7px 12px;border:none;background:var(--surface);color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;}
  .view-toggle button.active{background:var(--ink);color:var(--bg);}
  .view-toggle button+button{border-left:1px solid var(--border);}

  /* ---------- Kanban ---------- */
  .kanban{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px;}
  .kanban-col{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;display:flex;flex-direction:column;min-width:240px;}
  .kanban-col.dragover{outline:2px dashed var(--accent);outline-offset:-4px;background:var(--accent-wash);}
  .kanban-col-head{padding:13px 14px 10px;display:flex;align-items:center;justify-content:space-between;}
  .kanban-col-head .t{font-size:12.5px;font-weight:800;color:var(--ink);}
  .kanban-count{font-size:11px;font-weight:800;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums;}
  .kanban-cards{display:flex;flex-direction:column;gap:9px;padding:0 10px 12px;min-height:70px;}
  .kcard{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 12px;cursor:pointer;box-shadow:var(--shadow);}
  .kcard:hover{border-color:var(--muted-2);}
  .kcard.dragging{opacity:.4;}
  .kcard .kc-name{font-size:13px;font-weight:800;color:var(--ink);}
  .kcard .kc-sub{font-size:11px;color:var(--muted);margin-top:2px;}
  .kcard .kc-meta{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:6px;}
  .kcard .kc-actions{display:flex;gap:6px;}
  .kcard .kc-actions a{width:23px;height:23px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--muted);}
  .kcard .kc-actions a:hover{color:var(--accent);}
  .kc-avatar{width:21px;height:21px;border-radius:7px;background:var(--info-wash);color:var(--info);font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .kc-followup{font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--border-soft);color:var(--muted);white-space:nowrap;}
  .kc-followup.overdue{background:var(--danger-wash);color:var(--danger);}

  /* ---------- Lead detail drawer ---------- */
  .lead-drawer{max-width:660px;}
  .ld-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
  .ld-col h4{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-2);font-weight:800;margin:0 0 10px;}
  .ld-timeline{display:flex;flex-direction:column;gap:9px;max-height:230px;overflow-y:auto;padding-right:4px;}
  .ld-note{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:10px;padding:9px 11px;}
  .ld-note .n-text{font-size:12.5px;color:var(--ink-soft);line-height:1.5;white-space:pre-wrap;}
  .ld-note .n-meta{font-size:10.5px;color:var(--muted-2);margin-top:5px;font-weight:700;}
  .ld-add{display:flex;gap:8px;margin-top:11px;}
  .ld-add textarea{flex:1;min-height:44px;padding:8px 10px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);color:var(--ink);font-family:inherit;font-size:12.5px;resize:vertical;}
  .contact-links{display:flex;gap:8px;}
  .contact-links a{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:9px;border:1px solid var(--border);color:var(--muted);}
  .contact-links a:hover{color:var(--accent);border-color:var(--accent);}
  .ld-empty{font-size:12px;color:var(--muted-2);font-style:italic;}

  /* ---------- Media gallery ---------- */
  .media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;}
  .media-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);}
  .media-thumb{width:100%;aspect-ratio:4/3;background:var(--surface-2);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;color:var(--muted-2);}
  .media-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .media-actions{position:absolute;top:7px;right:7px;display:flex;gap:5px;}
  .media-actions button{width:25px;height:25px;border-radius:7px;border:none;background:rgba(20,22,18,.55);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .media-actions button:hover{background:rgba(20,22,18,.82);}
  .media-cat-tag{position:absolute;left:7px;top:7px;background:rgba(255,255,255,.92);color:var(--ink);font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:999px;}
  .media-body{padding:9px 11px 11px;}
  .media-body .cap{font-size:12px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .media-body .meta{font-size:10.5px;color:var(--muted);margin-top:2px;}

  .upload-drop{border:1.5px dashed var(--border);border-radius:12px;padding:22px 14px;text-align:center;color:var(--muted);cursor:pointer;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;gap:6px;}
  .upload-drop:hover{border-color:var(--accent);color:var(--accent-ink);}
  .upload-drop .t{font-size:12.5px;font-weight:700;}
  .upload-drop .s{font-size:11px;color:var(--muted-2);}
  .upload-preview-wrap{margin-top:10px;position:relative;}
  .upload-preview{width:100%;max-height:170px;object-fit:cover;border-radius:10px;display:block;}

  /* ---------- Testimonials ---------- */
  .tm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
  .tm-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:9px;}
  .tm-stars{display:flex;gap:2px;color:var(--accent);}
  .tm-stars .off{color:var(--border);}
  .tm-text{font-size:13px;color:var(--ink-soft);line-height:1.55;flex:1;}
  .tm-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px;}
  .tm-name{font-size:12.5px;font-weight:800;color:var(--ink);}
  .tm-proj{font-size:11px;color:var(--muted);margin-top:1px;}
  .tm-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}

  @media(max-width:920px){
    .grid-kpi{grid-template-columns:repeat(2,1fr);}
    .two-col{grid-template-columns:1fr;}
    .sidebar{position:fixed;transform:translateX(-100%);transition:transform .2s;z-index:60;box-shadow:0 0 0 100vmax rgba(0,0,0,0);}
  }
  @media (prefers-reduced-motion: reduce){
    .toast{animation:none;}
    .sidebar{transition:none;}
  }
</style>

    if(h < 24) return h + " soat oldin";
    var d = Math.round(h/24);
    return d + " kun oldin";
  }

  /* ============ DB (REST /api/admin/* orqali) ============ */
  var API_BASE = "/api/admin";
  var listeners = {}; // collection name -> {cb, errCb}
  var settingsListener = null;

  function onUnauthorized(){
    var appEl = document.querySelector(".app");
    if(appEl) appEl.style.display = "none";
    var gate = document.getElementById("loginGate");
    gate.style.display = "flex";
    document.getElementById("loginError").hidden = true;
    bindLoginForm();
  }

  function handleRes(res){
    if(res.status === 401){ onUnauthorized(); throw new Error("unauthorized"); }
    if(!res.ok){
      return res.json().catch(function(){ return {}; }).then(function(j){
        throw new Error(j.error || ("HTTP "+res.status));
      });
    }
    if(res.status === 204) return null;
    return res.json();
  }
  function apiGet(url){ return fetch(url, {credentials:"same-origin"}).then(handleRes); }
  function apiPost(url, data){
    return fetch(url, {method:"POST", credentials:"same-origin", headers:{"Content-Type":"application/json"}, body:JSON.stringify(data)}).then(handleRes);
  }
  function apiPatch(url, data){
    return fetch(url, {method:"PATCH", credentials:"same-origin", headers:{"Content-Type":"application/json"}, body:JSON.stringify(data)}).then(handleRes);
  }
  function apiPut(url, data){
    return fetch(url, {method:"PUT", credentials:"same-origin", headers:{"Content-Type":"application/json"}, body:JSON.stringify(data)}).then(handleRes);
  }
  function apiDelete(url){
    return fetch(url, {method:"DELETE", credentials:"same-origin"}).then(handleRes);
  }

  function refetch(name){
    var l = listeners[name];
    if(!l) return Promise.resolve();
    return apiGet(API_BASE+"/"+name).then(function(rows){
      l.cb({ docs: rows.map(function(row){ return { id: row.id, data: function(){ return row; } }; }) });
    }).catch(function(err){
      if(l.errCb) l.errCb(err);
    });
  }

  function refetchSettings(){
    if(!settingsListener) return Promise.resolve();
    return apiGet(API_BASE+"/settings").then(function(data){
      settingsListener({ exists:true, data: function(){ return data; } });
    }).catch(function(err){ console.error("settings", err); });
  }

  function docRef(name, id){
    return {
      id: id,
      update: function(data){ return apiPatch(API_BASE+"/"+name+"/"+id, data).then(function(r){ refetch(name); return r; }); },
      set: function(data){
        if(name === "settings"){ return apiPut(API_BASE+"/settings", data).then(function(r){ refetchSettings(); return r; }); }
        var op = id ? apiPatch(API_BASE+"/"+name+"/"+id, data) : apiPost(API_BASE+"/"+name, data);
        return op.then(function(r){ refetch(name); return r; });
      },
      delete: function(){ return apiDelete(API_BASE+"/"+name+"/"+id).then(function(r){ refetch(name); return r; }); },
      onSnapshot: function(cb){ settingsListener = cb; refetchSettings(); }
    };
  }

  function col(name){
    return {
      doc: function(id){ return docRef(name, id || null); },
      add: function(data){ return apiPost(API_BASE+"/"+name, data).then(function(r){ refetch(name); return r; }); },
      onSnapshot: function(cb, errCb){ listeners[name] = {cb:cb, errCb:errCb}; refetch(name); }
    };
  }

  var db = {
    collection: col,
    doc: function(path){
      var parts = path.split("/");
      return docRef(parts[0], parts[1]);
    }
  };

  function subscribe(name){
    col(name).onSnapshot(function(snap){
      state[name] = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      state.ready[name] = true;
      route(false);
    }, function(err){
      console.error(name, err);
      if(err.message !== "unauthorized") toast("Ma'lumot yuklashda xatolik: "+name, true);
    });
  }

  function subscribeSettings(){
    db.doc("settings/main").onSnapshot(function(snap){
      if(snap.exists){
        state.settings = Object.assign({}, state.settings, snap.data());
      }
      state.ready.settings = true;
      route(false);
    });
  }

  function bindKanbanDrag(){
    if(!can("leads")) return;
    var cards = document.querySelectorAll("[data-lead-card]");
    cards.forEach(function(card){
      card.addEventListener("dragstart", function(e){
        card.classList.add("dragging");
        e.dataTransfer.setData("text/plain", card.getAttribute("data-lead-card"));
        e.dataTransfer.effectAllowed = "move";
      });
      card.addEventListener("dragend", function(){ card.classList.remove("dragging"); });
    });
    var zones = document.querySelectorAll("[data-dropzone]");
    zones.forEach(function(zone){
      var col = zone.closest(".kanban-col");
      zone.addEventListener("dragover", function(e){ e.preventDefault(); col.classList.add("dragover"); });
      zone.addEventListener("dragleave", function(){ col.classList.remove("dragover"); });
      zone.addEventListener("drop", function(e){
        e.preventDefault();
        col.classList.remove("dragover");
        var leadId = e.dataTransfer.getData("text/plain");
        var newStatus = zone.getAttribute("data-dropzone");
        var lead = state.leads.filter(function(l){return l.id===leadId;})[0];
        if(!lead || lead.status===newStatus) return;
        db.doc("leads/"+leadId).update({status:newStatus})
          .then(function(){ toast("Holat yangilandi: "+LEAD_STATUS[newStatus].t); })
          .catch(function(e2){ toast("Xatolik: "+(e2&&e2.message||""), true); });
      });
    });
  }

  function exportLeadsCsv(){
    var headers = ["Ism","Telefon","Loyiha","Manba","Mas'ul","Holat","Keyingi aloqa","So'nggi izoh","Sana"];
    var lines = [headers.join(",")];
    state.leads.forEach(function(l){
      var row = [l.name, l.phone, l.project_name, l.source, staffName(l.assigned_to), (LEAD_STATUS[l.status]||{}).t||l.status, l.next_follow_up||"", lastActivityText(l), fmtDate(l.created_at)];
      lines.push(row.map(function(v){
        var s = String(v==null?"":v).replace(/"/g,'""');
        return '"'+s+'"';
      }).join(","));
    });
    var csv = "﻿" + lines.join("\r\n");
    var blob = new Blob([csv], {type:"text/csv;charset=utf-8"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "global-avenue-lidlar.csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    toast("CSV fayl yuklandi");
  }

  /* image: resize in-browser (canvas) to a reasonable max size, then upload the
     real file to the server (/api/admin/upload) — the DB only ever stores a URL. */
  function compressImageToBlob(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onerror = function(){ reject(new Error("Faylni o'qib bo'lmadi")); };
      reader.onload = function(ev){
        var img = new Image();
        img.onerror = function(){ reject(new Error("Rasmni ochib bo'lmadi")); };
        img.onload = function(){
          var maxDim = 1600;
          var scale = Math.min(1, maxDim/Math.max(img.width, img.height));
          var w = Math.max(1, Math.round(img.width*scale));
          var h = Math.max(1, Math.round(img.height*scale));
          var canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          var ctx = canvas.getContext("2d");
          ctx.drawImage(img,0,0,w,h);
          canvas.toBlob(function(blob){
            if(!blob){ reject(new Error("Siqib bo'lmadi")); return; }
            resolve({blob:blob, w:w, h:h});
          }, "image/jpeg", 0.82);
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function uploadImageFile(file){
    return compressImageToBlob(file).then(function(res){
      var fd = new FormData();
      fd.append("file", res.blob, "image.jpg");
      return fetch(API_BASE+"/upload", {method:"POST", credentials:"same-origin", body:fd})
        .then(handleRes)
        .then(function(json){ return {url: json.url, w: res.w, h: res.h}; });
    });
  }

  /* ============ MODAL SYSTEM ============ */
  function openModal(title, fieldsHtml, onSubmit, danger){
    var overlay = document.getElementById("overlay");
    var modal = document.getElementById("modal");
    modal.className = "modal";
    modal.innerHTML = '<div class="modal-head"><h3>'+esc(title)+'</h3><button class="btn icon-btn btn-ghost" id="modalClose">✕</button></div>'+
      '<form id="modalForm"><div class="modal-body">'+fieldsHtml+'</div>'+
      '<div class="modal-foot"><button type="button" class="btn" id="modalCancel">Bekor qilish</button>'+
      '<button type="submit" class="btn '+(danger?'btn-primary" style="background:var(--danger);border-color:var(--danger);':'btn-primary')+'">Saqlash</button></div></form>';
    overlay.classList.add("show");
    function close(){ overlay.classList.remove("show"); modal.innerHTML=""; modal.className="modal"; }
    document.getElementById("modalClose").onclick = close;
    document.getElementById("modalCancel").onclick = close;
    document.getElementById("modalForm").onsubmit = function(e){
      e.preventDefault();
      var fd = new FormData(e.target);
      var data = {};
      fd.forEach(function(v,k){ data[k]=v; });
      onSubmit(data, close);
    };
  }
  function closeModalOnOverlay(){
    document.getElementById("overlay").addEventListener("click", function(e){
      if(e.target.id === "overlay"){
        e.target.classList.remove("show");
        var m = document.getElementById("modal");
        m.innerHTML=""; m.className="modal";
      }
    });
  }

  /* ============ EVENTS ============ */
  function bindEvents(){
    document.body.addEventListener("click", function(e){
      var nav = e.target.closest("[data-nav]");
      if(nav){ goTo(nav.getAttribute("data-nav")); return; }

      var f;
      if((f = e.target.closest("[data-filter-units]"))){ state.filters.units = f.getAttribute("data-filter-units"); renderUnits(); return; }
      if((f = e.target.closest("[data-filter-leads]"))){ state.filters.leads = f.getAttribute("data-filter-leads"); renderLeads(); return; }
      if((f = e.target.closest("[data-filter-posts]"))){ state.filters.posts = f.getAttribute("data-filter-posts"); renderPosts(); return; }
      if((f = e.target.closest("[data-filter-media]"))){ state.filters.media = f.getAttribute("data-filter-media"); renderMedia(); return; }

      if(e.target.closest("#btnAddProject")){ if(can("projects")) projectModal(null); return; }
      if(e.target.closest("#btnAddUnit")){ if(can("units")) unitModal(null); return; }
      if(e.target.closest("#btnAddLead")){ if(can("leads")) leadModal(null); return; }
      if(e.target.closest("#btnAddPost")){ if(can("posts")) openPostModal(null); return; }
      if(e.target.closest("#btnAddMedia")){ if(can("media")) openMediaModal(null); return; }
      if(e.target.closest("#btnAddTestimonial")){ if(can("testimonials")) testimonialModal(null); return; }
      if(e.target.closest("#btnAddStaff")){ if(can("staff")) staffModal(null); return; }
      if(e.target.closest("#btnExportLeads")){ exportLeadsCsv(); return; }

      var t;
      if((t = e.target.closest("[data-edit-project]")) && can("projects")){ projectModal(state.projects.filter(function(p){return p.id===t.getAttribute("data-edit-project");})[0]); return; }
      if((t = e.target.closest("[data-edit-unit]")) && can("units")){ unitModal(state.units.filter(function(u){return u.id===t.getAttribute("data-edit-unit");})[0]); return; }
      if((t = e.target.closest("[data-open-lead]"))){ var lo = state.leads.filter(function(l){return l.id===t.getAttribute("data-open-lead");})[0]; if(lo) openLeadDrawer(lo); return; }
      if((t = e.target.closest("[data-lead-card]")) && !e.target.closest("a")){ var lc = state.leads.filter(function(l){return l.id===t.getAttribute("data-lead-card");})[0]; if(lc) openLeadDrawer(lc); return; }
      if((t = e.target.closest("[data-lead-row]")) && !e.target.closest("select,button,a")){ var lr = state.leads.filter(function(l){return l.id===t.getAttribute("data-lead-row");})[0]; if(lr) openLeadDrawer(lr); return; }
      if((t = e.target.closest("[data-leads-view]"))){ state.leadsView = t.getAttribute("data-leads-view"); try{localStorage.setItem("ga_leads_view", state.leadsView);}catch(err){} renderLeads(); return; }
      if((t = e.target.closest("[data-edit-post]")) && can("posts")){ openPostModal(state.posts.filter(function(p){return p.id===t.getAttribute("data-edit-post");})[0]); return; }
      if((t = e.target.closest("[data-edit-media]")) && can("media")){ openMediaModal(state.media.filter(function(m){return m.id===t.getAttribute("data-edit-media");})[0]); return; }
      if((t = e.target.closest("[data-edit-testimonial]")) && can("testimonials")){ testimonialModal(state.testimonials.filter(function(x){return x.id===t.getAttribute("data-edit-testimonial");})[0]); return; }
      if((t = e.target.closest("[data-edit-staff]")) && can("staff")){ staffModal(state.staff.filter(function(s){return s.id===t.getAttribute("data-edit-staff");})[0]); return; }

      if((t = e.target.closest("[data-del-project]")) && can("projects")){
        var pid=t.getAttribute("data-del-project");
        confirmDelete("Loyihani o'chirmoqchimisiz? Unga bog'liq xonadonlar ro'yxatda qolib ketishi mumkin.", function(){
          db.doc("projects/"+pid).delete().then(function(){toast("Loyiha o'chirildi");}).catch(function(e){toast("Xatolik: "+(e&&e.message||""),true);});
        }); return;
      }
      if((t = e.target.closest("[data-del-unit]")) && can("units")){
        var uid_=t.getAttribute("data-del-unit");
        confirmDelete("Xonadonni o'chirmoqchimisiz?", function(){
          db.doc("units/"+uid_).delete().then(function(){toast("Xonadon o'chirildi");}).catch(function(e){toast("Xatolik: "+(e&&e.message||""),true);});
        }); return;
      }
      if((t = e.target.closest("[data-del-lead]")) && can("leads")){
        var lid=t.getAttribute("data-del-lead");
        confirmDelete("Arizani o'chirmoqchimisiz?", function(){
          db.doc("leads/"+lid).delete().then(function(){toast("Ariza o'chirildi");}).catch(function(e){toast("Xatolik: "+(e&&e.message||""),true);});
        }); return;
      }
      if((t = e.target.closest("[data-del-post]")) && can("posts")){
        var pid2=t.getAttribute("data-del-post");
        confirmDelete("Maqolani o'chirmoqchimisiz?", function(){
          db.doc("posts/"+pid2).delete().then(function(){toast("Maqola o'chirildi");}).catch(function(e){toast("Xatolik: "+(e&&e.message||""),true);});
        }); return;
      }
      if((t = e.target.closest("[data-del-media]")) && can("media")){
        var mid=t.getAttribute("data-del-media");
        confirmDelete("Rasmni o'chirmoqchimisiz?", function(){
          db.doc("media/"+mid).delete().then(function(){toast("Rasm o'chirildi");}).catch(function(e){toast("Xatolik: "+(e&&e.message||""),true);});
        }); return;
      }
      if((t = e.target.closest("[data-del-testimonial]")) && can("testimonials")){
        var tid=t.getAttribute("data-del-testimonial");
        confirmDelete("Fikrni o'chirmoqchimisiz?", function(){
          db.doc("testimonials/"+tid).delete().then(function(){toast("Fikr o'chirildi");}).catch(function(e){toast("Xatolik: "+(e&&e.message||""),true);});
        }); return;
      }
      if((t = e.target.closest("[data-del-staff]")) && can("staff")){
        var sid=t.getAttribute("data-del-staff");
        confirmDelete("Xodimni ro'yxatdan o'chirmoqchimisiz?", function(){
          db.doc("staff/"+sid).delete().then(function(){toast("Xodim o'chirildi");}).catch(function(e){toast("Xatolik: "+(e&&e.message||""),true);});
        }); return;
      }
    });

    document.body.addEventListener("change", function(e){
      var t;
      if((t = e.target.closest("[data-status-unit]")) && can("units")){
        db.doc("units/"+t.getAttribute("data-status-unit")).update({status:t.value})
          .then(function(){ toast("Holat yangilandi"); }).catch(function(e2){ toast("Xatolik: "+(e2&&e2.message||""), true); });
        return;
      }
      if((t = e.target.closest("[data-status-lead]")) && can("leads")){
        db.doc("leads/"+t.getAttribute("data-status-lead")).update({status:t.value})
          .then(function(){ toast("Holat yangilandi"); }).catch(function(e2){ toast("Xatolik: "+(e2&&e2.message||""), true); });
        return;
      }
      if(e.target.id === "roleSelect"){
        state.role = e.target.value;
        try{ localStorage.setItem("ga_admin_role", state.role); }catch(err){}
        route(false);
        return;
      }
    });

    document.body.addEventListener("input", function(e){
      if(e.target.id === "leadSearch"){
        state.filters.leadsQuery = e.target.value;
        var pos = e.target.selectionStart;
        renderLeads();
        var el = document.getElementById("leadSearch");
        if(el){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(err){} }
      }
    });

    document.body.addEventListener("submit", function(e){
      if(e.target.id === "settingsForm"){
        e.preventDefault();
        if(!can("settings")) return;
        var fd = new FormData(e.target);
        var data = {};
        fd.forEach(function(v,k){ data[k]=v; });
        db.doc("settings/main").set(Object.assign({}, state.settings, data))
          .then(function(){ toast("Sozlamalar saqlandi"); })
          .catch(function(e2){ toast("Xatolik: "+(e2&&e2.message||""), true); });
      }
    });

    closeModalOnOverlay();
  }

  /* ============ AUTH GATE (server session cookie orqali) ============ */
  function bindLoginForm(){
    var form = document.getElementById("loginForm");
    var errEl = document.getElementById("loginError");
    var pwdEl = document.getElementById("loginPassword");
    form.onsubmit = function(e){
      e.preventDefault();
      errEl.hidden = true;
      apiPost(API_BASE+"/login", {password: pwdEl.value}).then(function(){
        document.getElementById("loginGate").style.display = "none";
        var appEl = document.querySelector(".app");
        if(appEl) appEl.style.display = "";
        startApp();
      }).catch(function(){
        errEl.textContent = "Parol noto'g'ri";
        errEl.hidden = false;
        pwdEl.value = "";
        pwdEl.focus();
      });
    };
  }

  function logout(){
    fetch(API_BASE+"/logout", {method:"POST", credentials:"same-origin"}).finally(function(){ location.reload(); });
  }

  /* ============ INIT ============ */
  function init(){
    var gate = document.getElementById("loginGate");
    apiGet(API_BASE+"/session").then(function(){
      gate.style.display = "none";
      startApp();
    }).catch(function(){
      gate.style.display = "flex";
      bindLoginForm();
    });
  }

  function startApp(){
    try{
      var savedRole = localStorage.getItem("ga_admin_role");
      if(savedRole && PERMS[savedRole]) state.role = savedRole;
    }catch(e){}

    bindEvents();
    route(false);

    var logoutBtn = document.getElementById("btnLogout");
    if(logoutBtn) logoutBtn.onclick = logout;

    subscribe("projects");
    subscribe("units");
    subscribe("leads");
    subscribe("posts");
    subscribe("staff");
    subscribe("media");
    subscribe("testimonials");
    subscribeSettings();
  }

  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
